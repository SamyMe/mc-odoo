version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8000
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_certs:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_certs:
